# ══════════════════════════════════════════════════════════════════════════════
# FINANCIAL-SERVICE — PRODUCTION
# ══════════════════════════════════════════════════════════════════════════════

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: financial-service

  main:
    allow-bean-definition-overriding: false

  output:
    ansi:
      enabled: NEVER

  lifecycle:
    timeout-per-shutdown-phase: 30s

  cloud:
    compatibility-verifier:
      enabled: false

  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE:learning_management}
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:financial-service-group}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: ${KAFKA_TRUSTED_PACKAGES:*}
        session.timeout.ms: 60000
        heartbeat.interval.ms: 20000
        max.poll.interval.ms: 300000
        max.poll.records: 10
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        retry.backoff.ms: 1000
        max.in.flight.requests.per.connection: 1
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      request.timeout.ms: 30000
      connections.max.idle.ms: 540000
      reconnect.backoff.ms: 1000
      reconnect.backoff.max.ms: 10000

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# ══════════════════════════════════════════════════════════════════════════════
# EUREKA — FIXED FOR CLOUD RUN
# ══════════════════════════════════════════════════════════════════════════════
eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:https://educonservicediscovery-64307221061.asia-south1.run.app/eureka/}

    # Increased from 15 → 30: Cloud Run cold starts take 5–15s,
    # a tight interval floods logs with TransportException noise
    registry-fetch-interval-seconds: 30

    # Increased from 10 → 15: gives Eureka server time to respond after cold start
    eureka-server-connect-timeout-seconds: 15

    # Increased from 10 → 20: prevents premature timeout while server warms up
    eureka-server-read-timeout-seconds: 20

    # Prevents Eureka client from giving up after a single server failure
    eureka-server-total-connections: 200
    eureka-server-total-connections-per-host: 50

    # Prevents duplicate heartbeat threads accumulating on reconnect
    heartbeat-executor-thread-pool-size: 2
    cache-refresh-executor-thread-pool-size: 2

    # Initial registration delay — gives the app time to fully start
    initial-instance-info-replication-interval-seconds: 10
    instance-info-replication-interval-seconds: 30

    # Keep false — health check is done via health-check-url below, not push
    healthcheck:
      enabled: false

  instance:
    # Must be set to Cloud Run service host e.g.
    # financial-service-64307221061.asia-south1.run.app
    hostname: ${EUREKA_INSTANCE_HOSTNAME}
    prefer-ip-address: false

    # FIXED: was ${spring.application.name}:${eureka.instance.hostname}
    # Using property reference directly avoids circular resolution issues
    instance-id: ${spring.application.name}:${EUREKA_INSTANCE_HOSTNAME}

    non-secure-port-enabled: false
    secure-port-enabled: true
    secure-port: 443

    home-page-url: https://${eureka.instance.hostname}/
    status-page-url: https://${eureka.instance.hostname}/actuator/info
    health-check-url: https://${eureka.instance.hostname}/actuator/health

    # Increased from 10 → 15: reduces heartbeat noise on Cloud Run
    lease-renewal-interval-in-seconds: 15

    # Keep 90: gives enough grace time for Cloud Run cold starts
    lease-expiration-duration-in-seconds: 90

    # FIXED: changed from UP → STARTING
    # UP causes Eureka to route traffic before the app is ready
    # Spring Boot auto-transitions to UP after ApplicationReadyEvent
    initial-status: STARTING

# ══════════════════════════════════════════════════════════════════════════════
# FEIGN CLIENT SERVICE URLs
# ══════════════════════════════════════════════════════════════════════════════
feign:
  client:
    config:
      default:
        connectTimeout: 10000
        readTimeout: 30000
        loggerLevel: BASIC

auth-service:
  url: ${AUTH_SERVICE_URL}

course-service:
  url: ${COURSE_SERVICE_URL}

communication-service:
  url: ${COMMUNICATION_SERVICE_URL}

# ══════════════════════════════════════════════════════════════════════════════
# PAYMENT GATEWAYS
# ══════════════════════════════════════════════════════════════════════════════
payment:
  stripe:
    api-key: ${STRIPE_SECRET_KEY}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    api-version: ${STRIPE_API_VERSION:2023-10-16}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID}
    key-secret: ${RAZORPAY_KEY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}
    mock-mode: ${RAZORPAY_MOCK_MODE:false}
    account-number: ${RAZORPAY_ACCOUNT_NUMBER}

commission:
  one-time: ${COMMISSION_ONE_TIME:0.20}
  recurring: ${COMMISSION_RECURRING:0.10}

payout:
  mock-mode: ${PAYOUT_MOCK_MODE:true}
  schedule:
    day-of-week: ${PAYOUT_DAY_OF_WEEK:MONDAY}
    hour: ${PAYOUT_HOUR:9}
    minute: ${PAYOUT_MINUTE:0}
  minimum-amount: ${PAYOUT_MINIMUM_AMOUNT:1000}

refund:
  cancellation-hours-threshold: ${REFUND_CANCELLATION_HOURS_THRESHOLD:24}
  processing-fee-percentage: ${REFUND_PROCESSING_FEE_PERCENTAGE:0.02}

# ══════════════════════════════════════════════════════════════════════════════
# MANAGEMENT & MONITORING
# ══════════════════════════════════════════════════════════════════════════════
management:
  endpoints:
    web:
      exposure:
        # Removed prometheus — add back only if you have a Prometheus scraper configured
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    mongo:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ══════════════════════════════════════════════════════════════════════════════
# LOGGING
# ══════════════════════════════════════════════════════════════════════════════
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.tcon.financialservice: ${LOG_LEVEL_APP:INFO}
    org.springframework.cloud.loadbalancer: WARN
    org.springframework.kafka: INFO
    org.apache.kafka: WARN
    # FIXED: changed from WARN → INFO so you can see registration/heartbeat events
    # Set back to WARN once registration is confirmed stable
    com.netflix.discovery: INFO
    com.netflix.eureka: INFO
    reactor.netty: WARN
    io.netty: ERROR
    org.springframework.data.mongodb.core.MongoTemplate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"