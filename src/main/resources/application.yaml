    publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_51Su9Hd2KyroM3brJExw3PFmDK0X8pSZV9W9JpvnmTTpz0P1ndA3aMJVTKFLOx7tjOqUtY8p5jIIOq8WX9RG4qJ3K00hcGb6iVW}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_fxlCtJPwYVSVCMR3kbIGaevgFkspeyLY}
