# Commission Configuration
commission:
  one-time: 0.20  # 20% commission for one-time bookings
  recurring: 0.10  # 10% commission for recurring courses

# Payout Configuration
payout:
  mock-mode: true
  schedule:
    day-of-week: MONDAY
    hour: 9
    minute: 0
  minimum-amount: 1000

# Refund Configuration
refund:
  cancellation-hours-threshold: 24
  processing-fee-percentage: 0.02

# Management & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# Logging Configuration

logging:
  level:
    root: INFO
    com.tcon.api_gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: DEBUG
    org.springframework.cloud.loadbalancer: WARN
    io.github.resilience4j: INFO
    reactor.netty: WARN
    io.netty: ERROR
    org.springframework.data.redis: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    # ✅ DISABLED: No file logging = No git conflicts!
